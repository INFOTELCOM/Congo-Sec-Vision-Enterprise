services:
  api:
    build: .
    container_name: congo-sec-vision
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SOC_BIND_IP:-127.0.0.1}:8081:8080"
    volumes:
      - csvg_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  csvg_data:
