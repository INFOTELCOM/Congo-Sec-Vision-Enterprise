name: SOC backend validation

on:
  push:
    branches:
      - feature/soc-threats-network-monitoring
      - integration/existing-platform-hardening
  pull_request:
    branches:
      - main
      - integration/existing-platform-hardening

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile backend and agent
        run: python -m compileall -q app agent
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
