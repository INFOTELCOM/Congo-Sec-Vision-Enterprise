name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure API endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = os.environ.get("API_BASE_URL", "").rstrip("/")
          supabase_url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          publishable_key = os.environ.get("SUPABASE_PUBLISHABLE_KEY", "")
          if value and not value.startswith("https://"):
              raise SystemExit("API_BASE_URL doit commencer par https://")
          if supabase_url and not supabase_url.startswith("https://"):
              raise SystemExit("SUPABASE_URL doit commencer par https://")
          if not publishable_key:
              raise SystemExit("SUPABASE_PUBLISHABLE_KEY manquante")
          Path("web/config.js").write_text(
              "window.CSV_API_BASE = " + json.dumps(value) + ";\\n" +
              "window.CSV_SUPABASE_URL = " + json.dumps(supabase_url) + ";\\n" +
              "window.CSV_SUPABASE_PUBLISHABLE_KEY = " + json.dumps(publishable_key) + ";\\n",
              encoding="utf-8"
          )
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
