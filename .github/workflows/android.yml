name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android launcher icons from the approved emblem
        run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("web/Emblème futuriste Congo Sec Vision.png")
          if not source.is_file():
              raise SystemExit(f"Approved emblem not found: {source}")
          original = Image.open(source).convert("RGBA")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = original.copy()
              icon.thumbnail((size,size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA",(size,size),(0,0,0,0))
              canvas.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
              canvas.save(folder/"ic_launcher.png", optimize=True)
          PY
      - name: Build debug APK for CI verification
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Congo-Sec-Vision-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verify required signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD secret" && exit 1)
      - name: Configure Android release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/congo-sec-vision-release.jks"
          test -s "$RUNNER_TEMP/congo-sec-vision-release.jks"
      - name: Build signed production APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/congo-sec-vision-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Prepare production APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/*.apk release-assets/Congo-Sec-Vision-Android.apk
      - name: Publish signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Congo-Sec-Vision-Android.apk
          generate_release_notes: true
