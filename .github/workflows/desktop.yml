name: Build desktop applications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'web/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  build:
    name: Build \${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
          - name: Linux (Ubuntu / Kali)
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: macOS
            os: macos-latest
            bundles: dmg
    runs-on: \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Configure public web client
        shell: bash
        env:
          API_BASE_URL: \${{ vars.API_BASE_URL }}
          SUPABASE_URL: \${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: \${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          values = {
              "CSV_API_BASE": os.environ.get("API_BASE_URL", "").rstrip("/"),
              "CSV_SUPABASE_URL": os.environ.get("SUPABASE_URL", "").rstrip("/"),
              "CSV_SUPABASE_PUBLISHABLE_KEY": os.environ.get("SUPABASE_PUBLISHABLE_KEY", "")
          }
          if not values["CSV_SUPABASE_URL"].startswith("https://") or not values["CSV_SUPABASE_PUBLISHABLE_KEY"]:
              raise SystemExit("Configure SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY dans les variables GitHub.")
          Path("web/config.js").write_text("".join(
              f"window.{key} = {json.dumps(value)};\\n" for key, value in values.items()
          ), encoding="utf-8")
          PY
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build installers
        working-directory: desktop
        run: npm run tauri -- build --bundles \${{ matrix.bundles }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: congo-sec-vision-\${{ matrix.name }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30
